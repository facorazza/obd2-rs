# specs-generator: regenerates the generated data tables in src/.
#
# Data tables are generated, not hand-ported, to avoid transcription
# errors. Run from the repo root:
#
#   cargo run -p specs-generator -- tools/specs-generator/sources src

[package]
name = "specs-generator"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Regenerates obd2-rs command/DTC tables from the SAE J1979/J2012 references"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
