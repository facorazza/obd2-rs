# Publish obd2-rs to crates.io on version tags.
#
# Runs on GitHub Actions and Gitea Actions. Requires a crates.io API token in
# the repository secret CARGO_REGISTRY_TOKEN (GitHub: Settings -> Secrets;
# Gitea: Settings -> Actions -> Secrets).

name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: rust:1-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libudev-dev pkg-config

      - name: Verify
        run: cargo test

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
