# CI for the obd2-rs library.

name: ci

on:
  push:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/**"
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/**"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rust:1-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libudev-dev pkg-config

      - name: Install rustfmt, clippy and the embedded target
        run: |
          rustup component add rustfmt clippy
          rustup target add riscv32imac-unknown-none-elf

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy without std
        run: cargo clippy --no-default-features -- -D warnings

      # The firmware links this crate without `std`, so a build for its target
      # is the real check that the split between the two feature sets holds.
      - name: Embedded build
        run: cargo build --no-default-features --target riscv32imac-unknown-none-elf

      - name: Release build
        run: cargo build --release

      - name: Package
        run: cargo package

      - name: Upload crate artifact
        uses: actions/upload-artifact@v7
        with:
          name: obd2-rs
          path: target/package/obd2-rs-*.crate
          if-no-files-found: error
          retention-days: 14
